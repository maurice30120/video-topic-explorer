name: Daily Pages

# Construit les data, produit le même site que le pipeline push (feed en
# index.html à la racine + graphe statique), déploie sur GitHub Pages puis
# contrôle de fumée. Un cron planifié ne s'exécute que sur la branche par défaut.

on:
  schedule:
    - cron: "30 3 * * *" # tous les jours à 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-daily
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 networkx matplotlib pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: "Départ par défaut du site (source unique : vte.DEFAULT_START)"
        run: echo "DEFAULT_START=$(python -c 'from vte import DEFAULT_START; print(DEFAULT_START)')" >> "$GITHUB_ENV"

      - name: Build data (corpus réel + démo)
        run: |
          python scripts/make_real_corpus.py
          python scripts/make_demo_corpus.py

      - name: Generate parcours (run)
        run: python -m vte.cli run data/corpus_real.json --start "$DEFAULT_START" --rayon 3 --out out/run/demo.json

      - name: Build site (feed en index.html à la racine + graphe statique)
        run: |
          python -m vte.cli feed data/corpus_real.json --out out/site/index.html
          python -m vte.cli graph data/corpus_real.json --run out/run/demo.json --out out/site/graphe.png

      - name: Smoke check generated site (feed à la racine, première carte dérivée du run généré)
        run: python -m vte.cli smoke --site out/site --run out/run/demo.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke check public URL (racine = feed, retries pendant la propagation Pages)
        run: |
          python -m vte.cli smoke --url "${{ steps.deployment.outputs.page_url }}" \
            --run out/run/demo.json --attempts 20 --delay 30
