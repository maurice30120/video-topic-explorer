name: Daily Pages

# Construit les data, prépare le site statique et déploie sur GitHub Pages.
# Un cron planifié ne s'exécute que sur la branche par défaut.

on:
  schedule:
    - cron: "30 3 * * *" # tous les jours à 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-daily
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 networkx matplotlib pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build data (corpus réel + démo)
        run: |
          python scripts/make_real_corpus.py
          python scripts/make_demo_corpus.py

      - name: Generate parcours (run)
        run: |
          python -m vte.cli run data/corpus_real.json --start ghnY4S8unMM --mode decouvrir --out out/run/demo.json
          python -m vte.cli run data/corpus_real.json --start ghnY4S8unMM --mode approfondir --out out/run/demo-approfondir.json

      - name: Render static site
        run: |
          python -m vte.cli render data/corpus_real.json --run out/run/demo.json --out out/site/parcours.html
          python -m vte.cli render data/corpus_real.json --run out/run/demo-approfondir.json --out out/site/parcours-approfondir.html
          python -m vte.cli graph data/corpus_real.json --run out/run/demo.json --out out/site/graphe.png
          cp out/site/parcours.html out/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
