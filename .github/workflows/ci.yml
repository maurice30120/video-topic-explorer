name: CI

# Pipeline push : tests, puis site (feed à la racine + graphe statique),
# puis déploiement GitHub Pages, puis contrôle de fumée de l'URL publique.
# Le cron quotidien (daily-pages.yml) produit exactement le même site avec
# les mêmes étapes de génération : feed en index.html à la racine, graphe,
# contrôle de fumée local avant tout déploiement.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 networkx pytest
      - name: Run tests
        run: python -m pytest tests/ -v

  site:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 networkx matplotlib
      - name: Generate parcours (run) on real corpus
        run: python -m vte.cli run data/corpus_real.json --start ghnY4S8unMM --mode decouvrir --out out/run/demo.json
      - name: Build site (feed en index.html à la racine + graphe statique)
        run: |
          python -m vte.cli feed data/corpus_real.json --start ghnY4S8unMM --out out/site/index.html
          python -m vte.cli graph data/corpus_real.json --run out/run/demo.json --out out/site/graphe.png
      - name: Smoke check generated site (feed à la racine, première carte dérivée du run généré)
        run: python -m vte.cli smoke --site out/site --run out/run/demo.json
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: run
          path: out/run/demo.json
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 networkx
      - name: Download run artifact (première vidéo attendue dérivée du run généré)
        uses: actions/download-artifact@v4
        with:
          name: run
      - name: Smoke check public URL (racine = feed, retries pendant la propagation Pages)
        run: |
          python -m vte.cli smoke --url "${{ needs.deploy-pages.outputs.page_url }}" \
            --run demo.json --attempts 20 --delay 30
