name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 networkx pytest
      - name: Run tests
        run: python -m pytest tests/ -v

  webpage:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 networkx matplotlib
      - name: Generate parcours (run) on real corpus
        run: |
          python -m vte.cli run data/corpus_real.json --start ghnY4S8unMM --mode decouvrir --out out/run/demo.json
          python -m vte.cli run data/corpus_real.json --start ghnY4S8unMM --mode approfondir --out out/run/demo-approfondir.json
      - name: Render web page and graph
        run: |
          python -m vte.cli render data/corpus_real.json --run out/run/demo.json --out out/site/parcours.html
          python -m vte.cli graph data/corpus_real.json --run out/run/demo.json --out out/site/graphe.png
      - name: Upload web page artifact
        uses: actions/upload-artifact@v4
        with:
          name: parcours-web
          path: out/site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: webpage
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
